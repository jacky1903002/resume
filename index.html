        function loadDataFromFirebase(uid) {
            const dbRef = ref(db, 'resumes/' + uid);
            onValue(dbRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    resumeData = Object.assign({}, resumeData, val);
                    updateUIFromData();
                } else {
                    saveDataToFirebase();
                }
            }, { onlyOnce: true });
        }

        async function saveDataToFirebase() {
            const user = auth.currentUser;
            if (!user) return;
            try {
                resumeData.lastSaved = new Date().toLocaleString();
                await set(ref(db, 'resumes/' + user.uid), resumeData);
                lastSavedTime.textContent = "上次儲存: " + resumeData.lastSaved;
                saveCloudBtn.innerHTML = `<i class="fa-solid fa-check"></i><span>已儲存</span>`;
                setTimeout(() => {
                    saveCloudBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>儲存至雲端</span>`;
                }, 2000);
            } catch (err) {
                alert("儲存失敗: " + err.message);
            }

            if (start && end) return `${start} - ${end}`;
            return start || end || '';

                    <div class="mb-6 flex space-x-4">
                        <button id="downloadPngBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-black px-6 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-sm transition">
                            <i class="fa-solid fa-download"></i><span>下載高畫質 PNG 圖片</span>
                        </button>
                        <button onclick="window.close()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-3 rounded-xl shadow-2xl text-sm transition">
                            關閉視窗
                        </button>
                    </div>

                    <div id="fullResumeCanvas" class="w-full max-w-[900px] bg-white text-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative" style="font-size: ${resumeData.fontSize || 100}%;">
                        <div class="w-full md:w-[340px] p-10 flex flex-col justify-between shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};">
                            <div>
                                <div class="w-48 h-48 mx-auto rounded-3xl shadow-lg overflow-hidden border-4 border-white mb-8 bg-white flex items-center justify-center">
                                    <img src="${resumeData.photoUrl}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1573496359142-b8d8773'">
                                </div>
                                <div class="space-y-4 text-xs font-bold text-slate-700">
                                    <div class="flex items-center space-x-3 bg-white/90 p-3.5 rounded-2xl shadow-sm">
                                        <div class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};"><i class="fa-solid fa-phone"></i></div>
                                        <span class="font-black text-slate-800">${resumeData.phone}</span>
                                    </div>
                                    <div class="flex items-center space-x-3 bg-white/90 p-3.5 rounded-2xl shadow-sm">
                                        <div class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};"><i class="fa-solid fa-envelope"></i></div>
                                        <span class="font-black text-slate-800">${resumeData.email}</span>
                                    </div>
                                    <div class="flex items-center space-x-3 bg-white/90 p-3.5 rounded-2xl shadow-sm">
                                        <div class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};"><i class="fa-solid fa-location-dot"></i></div>
                                        <span class="font-black text-slate-800">${resumeData.address}</span>
                                    </div>
                                    <div class="flex items-center space-x-3 bg-white/90 p-3.5 rounded-2xl shadow-sm">
                                        <div class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};"><i class="fa-solid fa-graduation-cap"></i></div>
                                        <span class="font-black text-slate-800">${resumeData.education}</span>
                                    </div>
                                    <div class="flex items-center space-x-3 bg-white/90 p-3.5 rounded-2xl shadow-sm">
                                        <div class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0" style="background-color: ${resumeData.themeColor || '#d9777f'};"><i class="fa-solid fa-award"></i></div>
                                        <span class="font-black text-slate-800">${resumeData.certification}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-8">
                                <div class="text-white px-6 py-3 rounded-full font-black text-center shadow-md mb-4" style="background-color: ${resumeData.themeDark || '#3b4954'};">
                                    技能專長
                                </div>
                                <div class="space-y-3">
                                    ${skillsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="flex-1 p-10 flex flex-col justify-between bg-white">
                            <div>
                                <div class="flex items-start justify-between border-b-2 border-slate-100 pb-6 mb-6">
                                    <div>
                                        <h2 class="text-4xl font-black text-slate-900 tracking-tight mb-1">${resumeData.nameZh}</h2>
                                        <div class="text-xl font-bold text-slate-500 tracking-wide">${resumeData.nameEn}</div>
                                    </div>
                                </div>
                                <div class="mb-8">
                                    <div class="inline-block text-white px-5 py-2 rounded-full font-black text-xs shadow-md mb-3" style="background-color: ${resumeData.themeDark || '#3b4954'};">
                                        關於我
                                    </div>
                                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-slate-700 leading-relaxed font-bold text-xs shadow-inner">
                                        ${resumeData.about}
                                    </div>
                                </div>
                                <div>
                                    <div class="inline-block text-white px-5 py-2 rounded-full font-black text-xs shadow-md mb-4" style="background-color: ${resumeData.themeDark || '#3b4954'};">
                                        經驗經歷
                                    </div>
                                    <div class="space-y-5 border-l-2 border-slate-200 ml-3 pl-6">
                                        ${expHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <script>
                        document.getElementById('downloadPngBtn').addEventListener('click', () => {
                            const canvasEl = document.getElementById('fullResumeCanvas');
                            html2canvas(canvasEl, { scale: 3, useCORS: true }).then(canvas => {
                                const link = document.createElement('a');
                                link.download = '${resumeData.nameZh}_高畫質履歷.png';
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            });
                        });
                    <\/script>
                </body>
                </html>
            `;

            newWindow.document.write(htmlContent);
            newWindow.document.close();
        });

        exportExcelBtn.addEventListener('click', () => {
            const wb = XLSX.utils.book_new();
            const basicData = [
                { 欄位: "中文姓名", 數值: resumeData.nameZh },
                { 欄位: "英文名/職稱", 數值: resumeData.nameEn },
                { 欄位: "照片網址", 數值: resumeData.photoUrl },
                { 欄位: "電話號碼", 數值: resumeData.phone },
                { 欄位: "電子信箱", 數值: resumeData.email },
                { 欄位: "工作室地址", 數值: resumeData.address },
                { 欄位: "學歷背景", 數值: resumeData.education },
                { 欄位: "認證榮譽", 數值: resumeData.certification },
                { 欄位: "關於我", 數值: resumeData.about },
                { 欄位: "主題色", 數值: resumeData.themeColor },
                { 欄位: "深色調", 數值: resumeData.themeDark },
                { 欄位: "字型比例", 數值: resumeData.fontSize }
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(basicData), "基本資料");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumeData.experiences || []), "經驗經歷");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumeData.skills || []), "技能專長");
            XLSX.writeFile(wb, `${resumeData.nameZh}_履歷資料.xlsx`);
        });

        importExcelInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                if (workbook.Sheets["基本資料"]) {
                    const basicJson = XLSX.utils.sheet_to_json(workbook.Sheets["基本資料"]);
                    basicJson.forEach(item => {
                        if (item.欄位 === "中文姓名") resumeData.nameZh = item.數值;
                        if (item.欄位 === "英文名/職稱") resumeData.nameEn = item.數值;
                        if (item.欄位 === "照片網址") resumeData.photoUrl = item.數值;
                        if (item.欄位 === "電話號碼") resumeData.phone = item.數值;
                        if (item.欄位 === "電子信箱") resumeData.email = item.數值;
                        if (item.欄位 === "工作室地址") resumeData.address = item.數值;
                        if (item.欄位 === "學歷背景") resumeData.education = item.數值;
                        if (item.欄位 === "認證榮譽") resumeData.certification = item.數值;
                        if (item.欄位 === "關於我") resumeData.about = item.數值;
                        if (item.欄位 === "主題色") resumeData.themeColor = item.數值;
                        if (item.欄位 === "深色調") resumeData.themeDark = item.數值;
                        if (item.欄位 === "字型比例") resumeData.fontSize = item.數值;
                    });
                }

                if (workbook.Sheets["經驗經歷"]) {
                    resumeData.experiences = XLSX.utils.sheet_to_json(workbook.Sheets["經驗經歷"]);
                }

                if (workbook.Sheets["技能專長"]) {
                    resumeData.skills = XLSX.utils.sheet_to_json(workbook.Sheets["技能專長"]);
                }

                updateUIFromData();
                saveDataToFirebase();
                alert("Excel 資料成功匯入並同步！");
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
